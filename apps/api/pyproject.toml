[project]
name = "blackmamba"
version = "0.1.0"
description = "BLACK MAMBA — evidence management API for scam and fraud investigations"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.29",
    "cryptography>=50.0.2",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langgraph>=1.2.20",
    "minio>=7.2.20",
    "playwright>=1.64.1",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.15.1",
    "pyotp>=2.10.0",
    "python-multipart>=0.0.33",
    "redis>=5.0",
    "rq>=1.16",
    "sqlalchemy[asyncio]>=2.0.30",
    "uvicorn[standard]>=0.30",
    "weasyprint>=70.0",
    "filetype>=1.2.0",
    "anthropic>=2.6.0",
]

[project.scripts]
blackmamba = "blackmamba.cli:main"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "httpx>=0.27",
    "mypy>=1.10",
    "pip-audit>=2.10.1",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=7.1.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blackmamba"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF", "ASYNC", "PT",
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["blackmamba"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "PT018", "E501", "ASYNC240"]
# Pydantic copies field defaults per instance, so list/dict defaults are safe.
"src/blackmamba/schemas/**" = ["RUF012", "S105"]
# Enum values / token type names, not passwords.
"src/blackmamba/models/**" = ["S105"]
"src/blackmamba/core/security.py" = ["S105"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["weasyprint", "weasyprint.*", "filetype", "asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "db: requires a reachable PostgreSQL (skipped otherwise)",
]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["blackmamba"]
branch = true
# SQLAlchemy's asyncio layer runs code in greenlets: tell coverage, or it under-reports.
concurrency = ["greenlet", "thread"]
omit = ["src/blackmamba/cli.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_also = ['if TYPE_CHECKING:', 'raise NotImplementedError', '^\s*\.\.\.\s*$']

# ---------------------------------------------------------------- bandit
[tool.bandit]
exclude_dirs = ["tests", ".venv"]
